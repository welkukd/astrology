# Astrology App — GitHub Actions CI/CD

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend: Type checking, lint, build
  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Type check
        run: cd apps/web && npx tsc --noEmit
      - name: Lint
        run: cd apps/web && npm run lint
      - name: Build
        run: cd apps/web && npm run build

  # Backend: Python checks
  backend-check:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          cd apps/api
          python -m py_compile app/main.py
          python -m py_compile app/core/config.py
          python -m py_compile app/core/database.py
          python -m py_compile app/core/security.py
          python -m py_compile app/services/calculator.py
          python -m py_compile app/services/ai.py
          python -m py_compile app/services/chart_context.py
          python -m py_compile app/services/dasha.py
          python -m py_compile app/services/pdf_generator.py
      - name: Import test
        run: |
          cd apps/api
          python -c "from app.main import app; print('App imports OK')"

  # Deploy frontend to Vercel
  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [frontend-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Deploy backend to Railway
  deploy-backend:
    name: Deploy Backend to Railway
    needs: [backend-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Login to Railway
        run: railway login --token=${{ secrets.RAILWAY_TOKEN }}
      - name: Link Railway project
        run: railway link ${{ secrets.RAILWAY_PROJECT_ID }}
      - name: Deploy to Railway
        run: |
          railway up --detach
      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://${{ secrets.RAILWAY_SERVICE_NAME }}.up.railway.app/health || exit 1

  # Notify on failure
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check, deploy-frontend, deploy-backend]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "Workflow failed: ${{ github.workflow }}"
          # Add webhook notification here (Slack, Discord, etc.)